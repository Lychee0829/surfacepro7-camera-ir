# SPDX-License-Identifier: GPL-2.0-only
#
# DKMS configuration for the Surface Pro 7 IPU4 camera/IR stack.
#
# DKMS is optional: the primary delivery path is the two pacman packages
# built from PKGBUILD / PKGBUILD.v4. This file is provided for users who
# prefer to rebuild the modules in place on every kernel update.
#
#   cp -a . /usr/src/surfacepro7-camera-ir-1
#   dkms install -m surfacepro7-camera-ir -v 1

PACKAGE_NAME="surfacepro7-camera-ir"
PACKAGE_VERSION="1"

# Both build stages are driven by the top-level Makefile: the IPU4P ISP stack
# from src/intel-ipu4/ and the sensor/ACPI modules from the root Kbuild.
MAKE[0]="make KERNEL_VERSION=${kernelver} KDIR=/lib/modules/${kernelver}/build modules"
CLEAN="make KERNEL_VERSION=${kernelver} clean"

BUILT_MODULE_NAME[0]="intel-ipu4"
BUILT_MODULE_NAME[1]="intel-ipu4-isys"
BUILT_MODULE_NAME[2]="intel-ipu4-psys"
BUILT_MODULE_NAME[3]="intel-ipu4-isys-csslib"
BUILT_MODULE_NAME[4]="intel-ipu4-psys-csslib"
BUILT_MODULE_NAME[5]="ov5693"
BUILT_MODULE_NAME[6]="ov8865"
BUILT_MODULE_NAME[7]="ov7251"
BUILT_MODULE_NAME[8]="surfacepro7_acpi"

# The ISP modules are built in subdirectories; DKMS only looks in the source
# root unless told otherwise.
BUILT_MODULE_LOCATION[0]="src/intel-ipu4/drivers/media/pci/intel/ipu4"
BUILT_MODULE_LOCATION[1]="src/intel-ipu4/drivers/media/pci/intel/ipu4"
BUILT_MODULE_LOCATION[2]="src/intel-ipu4/drivers/media/pci/intel/ipu4"
BUILT_MODULE_LOCATION[3]="src/intel-ipu4/drivers/media/pci/intel/ipu4"
BUILT_MODULE_LOCATION[4]="src/intel-ipu4/drivers/media/pci/intel/ipu4/ipu4p-css/lib2600psys"

DEST_MODULE_LOCATION[0]="/extra/surfacepro7-camera-ir"
DEST_MODULE_LOCATION[1]="/extra/surfacepro7-camera-ir"
DEST_MODULE_LOCATION[2]="/extra/surfacepro7-camera-ir"
DEST_MODULE_LOCATION[3]="/extra/surfacepro7-camera-ir"
DEST_MODULE_LOCATION[4]="/extra/surfacepro7-camera-ir"
DEST_MODULE_LOCATION[5]="/extra/surfacepro7-camera-ir"
DEST_MODULE_LOCATION[6]="/extra/surfacepro7-camera-ir"
DEST_MODULE_LOCATION[7]="/extra/surfacepro7-camera-ir"
DEST_MODULE_LOCATION[8]="/extra/surfacepro7-camera-ir"

AUTOINSTALL="yes"
